<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0E1322"/>
            <stop offset="100%" stop-color="#080A12"/>
        </linearGradient>
        <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#7C5CFF"/>
            <stop offset="50%" stop-color="#00D4FF"/>
            <stop offset="100%" stop-color="#00FFA3"/>
        </linearGradient>
        <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#9D7BFF"/>
            <stop offset="100%" stop-color="#7C5CFF"/>
        </linearGradient>
        <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00E5FF"/>
            <stop offset="100%" stop-color="#00B8D9"/>
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="8" result="blur"/>
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
    </defs>
    <!-- Background rounded squircle -->
    <rect x="20" y="20" width="472" height="472" rx="110" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="14"/>
    
    <!-- Code5in Logo Mark -->
    <g transform="translate(30, 20)">
        <!-- Letter C (White) -->
        <path d="M 195 190 A 85 85 0 1 0 195 330" fill="none" stroke="#FFFFFF" stroke-width="38" stroke-linecap="round" filter="url(#glow)"/>
        <!-- Number 5 (Purple Accent) -->
        <path d="M 235 190 L 325 190 L 240 250 L 275 250 A 48 48 0 1 1 235 320" fill="none" stroke="url(#purpleGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
        <!-- Accent Dot (Cyan) -->
        <circle cx="360" cy="190" r="22" fill="url(#cyanGrad)" filter="url(#glow)"/>
    </g>
</svg>
